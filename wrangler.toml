# BTC_iquidation v1.1.0; optional Wrangler deployment, or paste worker/worker.js into Cloudflare editor.
name = "btc-liq-automator"
main = "worker/worker.js"
compatibility_date = "2026-10-17"

[[r2_buckets]]
binding = "BTC_RECORDS"
bucket_name = "btc-liq-records"

[vars]
ALLOWED_ORIGINS = "https://youjianchonglangshou-design.github.io"

[triggers]
# UTC 12:00 = Taipei 20:00; dispatch one GitHub YML; poll every 5m until TPE 07:55.
# UTC 00:01 = Taipei 08:01; repeat settlement every 5m if exchange's final closed bar is delayed.
crons = ["*/5 12-23 * * *", "1,6,11,16,21,26,31,36,41,46,51,56 0 * * *"]
