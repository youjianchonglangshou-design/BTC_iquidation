# BTC CoinGlass Daily Results v1.0.0
name = "btc-liq-automator"
main = "worker/worker.js"
compatibility_date = "2026-10-17"

[[r2_buckets]]
binding = "BTC_RECORDS"
bucket_name = "btc-liq-records"

[vars]
ALLOWED_ORIGINS = "https://youjianchonglangshou-design.github.io"

[triggers]
# Cloudflare uses UTC (Taiwan UTC+08:00)
# 12:00 UTC = 20:00 Taipei: CoinGlass capture + 39-feature frozen forecast.
# 00:01 UTC = next morning 08:01 Taipei: compare 48 closed 15M candles.
crons = ["0 12 * * *", "1 0 * * *"]
