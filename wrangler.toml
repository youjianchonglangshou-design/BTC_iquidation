name = "btc-liq-automator"
main = "worker/worker.js"
compatibility_date = "2026-10-16"

[[r2_buckets]]
binding = "BTC_RECORDS"
bucket_name = "btc-liq-records"

[vars]
ALLOWED_ORIGINS = "https://youjianchonglangshou-design.github.io"
ALLOW_LOCAL_FILE = "true"

[triggers]
# UTC, corresponding to Taiwan 20:02/20:07/20:12 and next 08:10/08:20/08:30.
crons = ["2,7,12 12 * * *", "10,20,30 0 * * *"]
# Secret BTC_RECORDS_TOKEN must be entered via Cloudflare dashboard or `wrangler secret put BTC_RECORDS_TOKEN`.
