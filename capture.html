<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"/><meta name="viewport" content="width=device-width, initial-scale=1"/>
<meta name="robots" content="noindex,nofollow"/><title>BTC CoinGlass｜雲端上下界暫存頁</title>
<style>html{background:#091725;color:#dcebf6;font:15px system-ui,sans-serif}body{max-width:650px;margin:9vh auto;padding:20px}main{border:1px solid #28485b;border-radius:12px;padding:22px;background:#102539}h1{font-size:19px}pre{white-space:pre-wrap;word-break:break-word;background:#071320;border-radius:9px;padding:14px;min-height:6em}b{color:#54dbc2}small{color:#91a6b3}button{background:#2a5366;color:white;border:0;border-radius:7px;padding:8px 12px;cursor:pointer}</style>
<script src="./coinglass-decrypt.js"></script></head><body><main>
<h1>BTC · CoinGlass 24H 清算上下界暫存頁</h1>
<p>資料狀態：<b id="status">讀取中</b></p>
<p><small>Cloudflare 雲端瀏覽器定時開啟這一頁，等待解碼完成，取得 JSON 並寫進 R2。不含 API 金鑰。</small></p>
<pre id="snapshot" aria-live="polite">{ "status": "loading" }</pre>
<button id="retry" type="button">重新讀取</button>
</main>
<script>
'use strict';
window.__cgSnapshot = {status:'loading'};
let attempt=0;
async function refresh() {
 const current=++attempt, begin=Date.now();
 window.__cgSnapshot={status:'loading',startedAt:begin};
 document.getElementById('status').textContent='讀取中';
 try {
  if(!window.CoinGlassReader?.fetchCoinGlass || !window.CoinGlassReader?.readMaxPain)throw Error('CoinGlass 解碼程式未載入');
  const res=await window.CoinGlassReader.fetchCoinGlass('24h');
  const btc=window.CoinGlassReader.readMaxPain(res.data);
  if(!btc)throw Error('成功解密但找不到 BTC 上下最大痛點');
  const upper=Number(btc.short), lower=Number(btc.long),reference=Number(btc.referencePrice)||null;
  if(!Number.isFinite(upper)||!Number.isFinite(lower)||upper<=lower||lower<=0)throw Error('上下界數值無效');
  const snap={status:'ready',source:'CoinGlass',range:'24h',symbol:'BTC',upper,lower,
   upperAmount:Number(btc.shortAmount)||null,lowerAmount:Number(btc.longAmount)||null,
   referencePrice:reference,version:String(res.version||''),observedAt:Date.now()};
  if(current!==attempt)return;
  window.__cgSnapshot=snap;
  document.getElementById('status').textContent='已成功解析';
  document.getElementById('snapshot').textContent=JSON.stringify(snap,null,2);
 }catch(error){
  if(current!==attempt)return;
  const failure={status:'error',observedAt:Date.now(),reason:String(error?.message||error).slice(0,180)};
  window.__cgSnapshot=failure;
  document.getElementById('status').textContent='讀取失敗（不使用假資料）';
  document.getElementById('snapshot').textContent=JSON.stringify(failure,null,2);
 }
}
document.getElementById('retry').addEventListener('click',refresh);
refresh();
</script></body></html>
